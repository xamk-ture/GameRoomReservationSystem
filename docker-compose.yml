version: '3.9'
services:
  db:
    image: postgres:16
    container_name: grbs-postgres
    environment:
      POSTGRES_USER: grbs
      POSTGRES_PASSWORD: grbs_pass
      POSTGRES_DB: gameroombooking
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grbs -d gameroombooking"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grbs-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=gameroombooking;Username=grbs;Password=grbs_pass
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata: